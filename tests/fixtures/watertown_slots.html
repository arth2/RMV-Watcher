<!DOCTYPE html>
<html>
<head>
    <title>Watertown Appointments</title>
</head>
<body>

    <div class="DateTimeGrouping-Group">

        </div>
        <input type="radio" name="date1" value="2025-11-08">
        <div class="times">
            <label class="time-slot">09:00 AM</label>
            <label class="time-slot">10:30 AM</label>
            <label class="time-slot">02:00 PM</label>
            <label class="time-slot">04:15 PM</label>

    </div>

    <div class="DateTimeGrouping-Group">
        <div class="DateTimeGrouping-Date">
            <label>November 10, 2025</label>
        </div>
        <input type="radio" name="date2" value="2025-11-10">
        <div class="times">
            <label class="time-slot">11:00 AM</label>
            <label class="time-slot">01:30 PM</label>
            <label class="time-slot">03:45 PM</label>
        </div>
    </div>

    <div class="DateTimeGrouping-Group">
        <div class="DateTimeGrouping-Date">
            <label>November 15, 2025</label>
        </div>
        <input type="radio" name="date3" value="2025-11-15">
        <div class="times">
            <label class="time-slot">08:00 AM</label>
            <label class="time-slot">12:00 PM</label>
        </div>
    </div>
</body>
</html>
