<!DOCTYPE html>
<html>
<head>
    <title>Haymarket Appointments</title>
</head>
<body>
    <h1>Haymarket - Available Appointments</h1>

    <div class="DateTimeGrouping-Group">
        <div class="DateTimeGrouping-Date">
            <label>11/09/2025</label>
        </div>
        <input type="radio" name="date1" value="2025-11-09">
        <div class="times">
            <label class="time-slot">09:30 AM</label>
            <label class="time-slot">11:00 AM</label>
        </div>
    </div>

    <div class="DateTimeGrouping-Group">
        <div class="DateTimeGrouping-Date">
            <label>Nov 12, 2025</label>
        </div>
        <input type="radio" name="date2" value="2025-11-12">
        <div class="times">
            <label class="time-slot">10:00 AM</label>
            <label class="time-slot">02:30 PM</label>
            <label class="time-slot">05:00 PM</label>
        </div>
    </div>
</body>
</html>
